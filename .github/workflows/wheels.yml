name: wheels
# Builds and tests the corvus-regex-ecma262 wheels (abi3, one for every Python from 3.10, on native runners for each
# platform) and its sdist, and uploads them as artifacts named wheel-* and sdist. Each wheel is tested on the oldest
# and the newest Python; on Linux x86_64 and Windows x64 the ECMA-262 test data (pinned to a commit) runs through it
# too, and must give no wrong answer, refusal of a valid pattern, acceptance of an invalid one or match at its limit.
# Called by ci.yml (every change) and pypi-publish.yml (a release), so a release uploads exactly what was built and
# tested here.
on:
  workflow_call:
    inputs:
      tag:
        # A release's tag (pypi-publish.yml): its version is written into pyproject.toml, Cargo.toml, Cargo.lock and
        # __version__, which hold 0.0.0, before the build (tools/release/stamp.ps1). Empty for CI, which builds the
        # placeholder.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto, dataset: true }
          - { name: linux aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { name: linux x86_64 musl, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, container: 'python:3.10-alpine' }
          - { name: linux aarch64 musl, os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2, container: 'python:3.10-alpine' }
          - { name: macos universal2, os: macos-latest, target: universal2-apple-darwin }
          - { name: windows x64, os: windows-latest, target: x64, dataset: true }
          # CPython has no 3.10 build for arm64 Windows: its oldest is 3.11.
          - { name: windows arm64, os: windows-11-arm, target: aarch64, oldest: '3.11' }
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Write the release's version
        if: inputs.tag != ''
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: ./tools/release/stamp.ps1 -Tag $env:TAG
      - name: Build
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Setup Python
        # abi3: one wheel serves every Python from 3.10, so test the oldest and the newest.
        if: ${{ !matrix.container }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            ${{ matrix.oldest || '3.10' }}
            3.14
      - name: Test (oldest and newest Python)
        if: ${{ !matrix.container }}
        shell: bash
        run: |
          for v in ${{ matrix.oldest || '3.10' }} 3.14; do
            python$v -m venv .venv-$v || py -$v -m venv .venv-$v
            py=.venv-$v/bin/python; [ -x "$py" ] || py=.venv-$v/Scripts/python.exe
            "$py" -m pip install -q pytest
            "$py" -m pip install -q --no-index --find-links dist corvus-regex-ecma262
            "$py" -m pytest -q tests
          done
      - name: Checkout the ECMA-262 test data
        if: ${{ matrix.dataset }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: corvus-dotnet/ecma262-regex-test-data
          ref: cff0860b7ebc5eb9c801eb9f8cec9d5398688ff2
          path: ecma262-regex-test-data
          persist-credentials: false
      - name: Run the ECMA-262 test data
        if: ${{ matrix.dataset }}
        shell: bash
        run: |
          py=.venv-3.14/bin/python; [ -x "$py" ] || py=.venv-3.14/Scripts/python.exe
          "$py" tools/dataset.py ecma262-regex-test-data/data wrong-cases.tsv
      - name: Keep the wrong cases
        if: ${{ failure() && matrix.dataset }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wrong-cases-${{ matrix.os }}
          path: wrong-cases.tsv
      - name: Test (musl)
        if: ${{ matrix.container }}
        run: |
          docker run --rm -v "$PWD:/io" -w /io ${{ matrix.container }} sh -c '
            pip install -q pytest &&
            pip install -q --no-index --find-links dist corvus-regex-ecma262 &&
            python -m pytest -q tests'
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Write the release's version
        if: inputs.tag != ''
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: ./tools/release/stamp.ps1 -Tag $env:TAG
      - name: Build
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
