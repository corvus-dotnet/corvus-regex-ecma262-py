[package]
name = "corvus-regex-ecma262-py"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Python bindings for the corvus-regex-ecma262 crate."
license = "Apache-2.0"
repository = "https://github.com/corvus-dotnet/corvus-regex-ecma262-py"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
corvus-regex-ecma262 = "0.2.0"
pyo3 = { version = "0.29.3", features = ["abi3-py310"] }
simdutf8 = "0.1.5"

[profile.release]
codegen-units = 1
lto = "fat"
